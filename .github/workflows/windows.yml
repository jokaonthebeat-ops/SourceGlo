# =============================================================================
#  Builds the Windows VST3 and standalone on a GitHub-hosted Windows runner.
#
#  This exists because a Windows VST3 is a PE DLL and must be compiled by MSVC
#  on Windows; it cannot be produced from the macOS development machine.
#
#  The build is verified on the runner with pluginval, which is the Windows
#  counterpart of the `auval` check used for the Audio Unit.
# =============================================================================

name: Windows

on:
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The generator is discovered rather than hardcoded. Pinning
      # "Visual Studio 17 2022" breaks the moment the runner image moves to a
      # newer Visual Studio - the compiler is still there, only the name changed.
      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found - no Visual Studio on this runner" }

          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property catalog_productLineVersion
          $path = & $vswhere -latest -products * `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath
          if (-not $vs) { throw "no Visual Studio with the C++ toolset installed" }

          Write-Host "Visual Studio $vs at $path"
          $gen = switch ($vs) {
            "2022" { "Visual Studio 17 2022" }
            "2026" { "Visual Studio 18 2026" }
            default { "" }
          }
          echo "VS_GENERATOR=$gen" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          if ($env:VS_GENERATOR) {
            cmake -B build-cmake -G "$env:VS_GENERATOR" -A x64
          } else {
            # Unknown Visual Studio version: let CMake pick its own default,
            # which is the newest generator it knows about.
            Write-Host "Unrecognised Visual Studio version - using CMake's default generator"
            cmake -B build-cmake -A x64
          }

      - name: Build
        run: cmake --build build-cmake --config Release --parallel

      - name: Locate artefacts
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Recurse -Filter "SourceGlo Pro.vst3" build-cmake |
                  Select-Object -First 1
          if (-not $vst3) { throw "VST3 not found - the build produced nothing" }
          echo "VST3_PATH=$($vst3.FullName)" >> $env:GITHUB_ENV
          Write-Host "VST3: $($vst3.FullName)"

      # The artwork lives inside the bundle at Contents/Resources/Assets. If the
      # POST_BUILD copy ever lands somewhere else, every control in the plugin
      # silently falls back to its vector stand-in - and a screenshot is the
      # only way anyone would notice. Check it here instead.
      - name: Check the artwork shipped
        shell: pwsh
        run: |
          $strip = Join-Path $env:VST3_PATH "Contents\Resources\Assets\Knobs\Filmstrips\knob_glo_280x280_128_vertical.png"
          if (-not (Test-Path $strip)) {
            Get-ChildItem -Recurse $env:VST3_PATH | Select-Object -First 40 |
              ForEach-Object { Write-Host $_.FullName }
            throw "artwork missing from the VST3 bundle"
          }
          Write-Host "artwork present: $strip"

      # pluginval instantiates the plugin, sweeps parameters, renders audio at
      # several sample rates and buffer sizes, and checks state round-trips.
      # Level 5 is the gate - it is what most commercial plugins target and what
      # a DAW actually exercises. Level 8 runs afterwards for information only.
      #
      # Neither pass uses --validate-in-process: out-of-process, a crash in the
      # child is reported with the test that caused it instead of killing the
      # runner silently.
      - name: Fetch pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $exe = Get-ChildItem -Recurse -Filter "pluginval.exe" pluginval | Select-Object -First 1
          echo "PLUGINVAL=$($exe.FullName)" >> $env:GITHUB_ENV

      # pluginval's progress logging drowns its verdict, and PowerShell prints
      # the throw wherever stderr happens to interleave - which is not where the
      # failure occurred. Capture the run and print only what matters.
      - name: Validate (strictness 5, blocking)
        shell: pwsh
        run: |
          & "$env:PLUGINVAL" --strictness-level 5 --timeout-ms 300000 "$env:VST3_PATH" 2>&1 |
            Tee-Object -FilePath pluginval-5.log
          $code = $LASTEXITCODE

          Write-Host "`n================ VERDICT (exit $code) ================"
          Select-String -Path pluginval-5.log -Pattern "FAIL|fail|\*\*\*|assert|Error|error" |
            ForEach-Object { Write-Host $_.Line }
          Write-Host "================ last 25 lines ================"
          Get-Content pluginval-5.log -Tail 25

          if ($code -ne 0) { throw "pluginval failed at strictness 5 (see verdict above)" }

      - name: Validate (strictness 8, informational)
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:PLUGINVAL" --strictness-level 8 --timeout-ms 300000 "$env:VST3_PATH" 2>&1 |
            Tee-Object -FilePath pluginval-8.log
          $code = $LASTEXITCODE
          Write-Host "`n================ VERDICT (exit $code) ================"
          Select-String -Path pluginval-8.log -Pattern "FAIL|fail|\*\*\*|assert|Error|error" |
            ForEach-Object { Write-Host $_.Line }
          Get-Content pluginval-8.log -Tail 25

      - name: Upload pluginval logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-*.log

      - name: Build installer (unsigned)
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\SourceGloPro.iss

      # One ZIP with both routes in it. Manual install is the default because it
      # avoids SmartScreen's "Windows protected your PC" prompt entirely - that
      # prompt is for executables, and dragging a .vst3 folder never triggers it.
      # The installer is there for anyone who prefers one.
      - name: Assemble distribution ZIP
        shell: pwsh
        run: |
          # Every error is fatal. A green run with no deliverable is worse than
          # a red one.
          $ErrorActionPreference = 'Stop'
          $stage = "dist-zip\SourceGlo Pro"
          New-Item -ItemType Directory -Force -Path "$stage\Manual Install" | Out-Null

          Copy-Item -Recurse "$env:VST3_PATH" "$stage\Manual Install"

          $exe = Get-ChildItem -Recurse -Filter "SourceGlo Pro.exe" build-cmake |
                 Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "$stage\Manual Install"
            # The standalone has no bundle, so its artwork sits beside the .exe.
            $assets = Join-Path $exe.DirectoryName "Assets"
            if (Test-Path $assets) {
              Copy-Item -Recurse $assets "$stage\Manual Install\Assets"
            } else {
              throw "standalone artwork missing - the .exe would open with no interface art"
            }
          }

          $inst = if (Test-Path build) {
                    Get-ChildItem -Recurse -Filter "SourceGloPro-*-Windows.exe" build |
                      Select-Object -First 1
                  } else { $null }
          if ($inst) {
            New-Item -ItemType Directory -Force -Path "$stage\Installer" | Out-Null
            Copy-Item $inst.FullName "$stage\Installer"
            Write-Host "installer included: $($inst.Name)"
          } else {
            Write-Host "installer not produced - shipping manual install only"
          }

          Copy-Item packaging\windows\INSTALL.txt $stage
          Copy-Item packaging\windows\license.txt $stage

          Compress-Archive -Path $stage -DestinationPath "SourceGloPro-1.0.0-Windows.zip" -Force
          Write-Host "--- ZIP contents ---"
          Get-ChildItem -Recurse $stage | ForEach-Object { $_.FullName.Replace((Get-Location).Path, "") }

      - name: Upload distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SourceGloPro-Windows-DISTRIBUTE-THIS
          path: SourceGloPro-1.0.0-Windows.zip
          if-no-files-found: error

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SourceGloPro-Windows-VST3
          path: build-cmake/SourceGloPro_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload standalone
        uses: actions/upload-artifact@v4
        with:
          name: SourceGloPro-Windows-Standalone
          path: build-cmake/SourceGloPro_artefacts/Release/Standalone/
          if-no-files-found: error

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SourceGloPro-Windows-Installer
          path: build/windows/*.exe
          if-no-files-found: warn
